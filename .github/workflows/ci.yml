name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete verification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep
      - name: Install locked dependencies
        run: npm ci
      - name: Verify real sandbox boundaries
        run: npm run verify:local-sandbox
      - name: Type checks, all tests, Gherkin and coverage
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/
            reports/spec-coverage.md
          if-no-files-found: warn
          retention-days: 14

  formal:
    name: Formal verification
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Check handoff correspondence
        run: python3 .agents/skills/verify-squad-handoff/scripts/check.py
      - name: Check delivery evidence and publication
        run: python3 .agents/skills/verify-squad-delivery/scripts/check.py
      - name: Check execution and host authority
        run: python3 .agents/skills/verify-squad-authority/scripts/check.py
      - name: Check budgets and shard convergence
        run: python3 .agents/skills/verify-squad-coordination/scripts/check.py
      - name: Retain formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}
          path: reports/verify-squad-*/
          if-no-files-found: error
          retention-days: 14
