name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete verification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep fonts-noto-cjk python3
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned real browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/squad-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/squad-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "SQUAD_PLAYWRIGHT_MODULE=$RUNNER_TEMP/squad-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          fc-match ":charset=4e2d"
      - name: Verify real sandbox boundaries
        run: npm run verify:local-sandbox
      - name: Verify native sandbox copies can execute concurrently
        run: node --import tsx tests/local-resource-sandbox-acceptance.ts
      - name: Verify resilience and deletion state models
        run: |
          node --import tsx tests/task-resilience-model-fixture.ts
          node --import tsx tests/execution-receipts-model-fixture.ts
          node --import tsx tests/partition-resilience-model-fixture.ts
          node --import tsx tests/local-resource-policy-model-fixture.ts
          node --import tsx tests/local-resource-preparation-model-fixture.ts
          node --import tsx tests/room-deletion-model-fixture.ts
          node --import tsx tests/process-supervisor-model-gate.ts
      - name: Type checks, all tests, Gherkin and coverage
        run: npm run check
      - name: Verify shared agent prompt injection fault detection
        run: |
          node tests/shared-agent-behavior-negative.mjs
          node --import tsx tests/shared-agent-behavior-live.ts --self-check
      - name: Verify crash and response-limit fault detection
        run: |
          node --import tsx scripts/verify-local-crash.ts --negative-controls
          node --import tsx scripts/verify-local-crash.ts
          node --import tsx scripts/verify-sqlite-crash.ts
          node tests/model-response-limit-negative.mjs
      - name: Verify resilience fault detection and bounded resource stability
        run: |
          node tests/resilience-negative-controls.mjs
          node --expose-gc --import tsx tests/resilience-soak.ts
          node --import tsx tests/tool-bootstrap-acceptance.ts
      - name: Verify complete tool inventory and selection fault detection
        run: node tests/tool-inventory-negative-controls.mjs
      - name: Verify original browser contracts detect faults
        run: node .agents/skills/verify-squad/scripts/negative.mjs
      - name: Verify composition fault detection and evidence
        run: |
          node tests/web-composition-negative.mjs
          node tests/service-composition-negative.mjs
          node tests/preparation-composition-controls.mjs
          node tests/preparation-composition-readback.mjs
          node tests/model-session-composition-controls.mjs
          node tests/model-session-composition-readback.mjs reports/kej-108-model-session test-results/cucumber.json
      - name: Production build
        run: npm run build
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/
            reports/
          if-no-files-found: warn
          retention-days: 14

  formal:
    name: Formal verification
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Check handoff correspondence
        run: python3 .agents/skills/verify-squad-handoff/scripts/check.py
      - name: Check delivery evidence and publication
        run: python3 .agents/skills/verify-squad-delivery/scripts/check.py
      - name: Check execution and host authority
        run: python3 .agents/skills/verify-squad-authority/scripts/check.py
      - name: Check budgets and shard convergence
        run: python3 .agents/skills/verify-squad-coordination/scripts/check.py
      - name: Independently read back formal evidence
        run: |
          for skill in handoff delivery authority coordination; do
            for evidence in reports/verify-squad-$skill/*/; do
              python3 .agents/skills/verify-squad-$skill/scripts/check.py --verify-evidence "$evidence"
            done
          done
      - name: Verify delivery evidence rejects self-consistent omissions
        run: |
          for evidence in reports/verify-squad-delivery/*/; do
            python3 .agents/skills/verify-squad-delivery/scripts/composition-evidence-controls.py "$evidence" --output reports/verify-squad-delivery-reader-controls/detailed.json
            python3 tests/local-effects-formal-readback-controls.py --checker .agents/skills/verify-squad-delivery/scripts/check.py --proof "$evidence" --evidence reports/verify-squad-delivery-reader-controls/raw
          done
      - name: Retain formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}
          path: reports/verify-squad-*/
          if-no-files-found: error
          retention-days: 14

  formal-composition:
    name: Formal composition (${{ matrix.slice }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: handoff
            checker: .agents/skills/verify-squad-handoff/scripts/check-composition.py
          - slice: authority
            checker: .agents/skills/verify-squad-authority/scripts/composition-check.py
          - slice: coordination
            checker: .agents/skills/verify-squad-coordination/scripts/check-extensions.py
          - slice: local-effects
            checker: .agents/skills/verify-squad-local-effects/scripts/check.py
          - slice: host-retry
            checker: .agents/skills/verify-squad-host-retry/scripts/check.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned TLC for each isolated matrix job
        run: |
          SQUAD_TLA_JAR="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl --fail --location --retry 2 --max-time 60 --output "$SQUAD_TLA_JAR" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  %s\n' "$SQUAD_TLA_JAR" | sha256sum --check
          echo "TLA2TOOLS_JAR=$SQUAD_TLA_JAR" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Check complete finite domain and implementation correspondence
        run: python3 "${{ matrix.checker }}" --evidence "reports/ci-${{ matrix.slice }}"
      - name: Independently read back retained evidence
        run: python3 "${{ matrix.checker }}" --verify-evidence "reports/ci-${{ matrix.slice }}"
      - name: Verify evidence readers reject missing and truncated proof
        if: matrix.slice == 'handoff' || matrix.slice == 'local-effects' || matrix.slice == 'host-retry'
        run: python3 tests/local-effects-formal-readback-controls.py --checker "${{ matrix.checker }}" --proof "reports/ci-${{ matrix.slice }}" --evidence "reports/ci-reader-controls-${{ matrix.slice }}"
      - name: Retain composition verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-composition-${{ matrix.slice }}-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
