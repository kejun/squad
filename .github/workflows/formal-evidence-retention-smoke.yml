name: Formal evidence retention smoke
on:
  push:
    branches: [chore/sync-provider-model-proof-20261113]
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Create a hidden formal input
        run: |
          mkdir -p reports/verify-squad-smoke/checker-inputs/.agents
          printf 'hidden formal input fixture\n' > reports/verify-squad-smoke/checker-inputs/.agents/fixture.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retention-formal-${{ github.sha }}
          path: reports/verify-squad-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: retention-composition-${{ github.sha }}
          path: reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: retention-*-${{ github.sha }}
          path: ${{ runner.temp }}/formal-retention-smoke
      - name: Verify both actual downloads retain the exact hidden input
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'formal-retention-smoke'
          archives = list(root.iterdir())
          assert len(archives) == 2
          for archive in archives:
              files = list(archive.rglob('fixture.txt'))
              assert len(files) == 1
              assert '.agents' in files[0].parts
              assert files[0].read_bytes() == b'hidden formal input fixture\n'
              print(archive.name + ': hidden input survived actual upload/download')
          PY
